name: build

# Every push builds and tests Windows, macOS and Linux and uploads a zip as a build artifact.
# To publish a GitHub Release: Actions tab > build > Run workflow > enter a version like v0.1.0.
# Pushing a version tag (e.g. v0.1.0) does the same.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish as a release, e.g. v0.1.0 (leave empty for a test build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Core tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="$GITHUB_REF_NAME"
          elif [[ -n "$RELEASE_VERSION" ]]; then VERSION="$RELEASE_VERSION"
          else VERSION="dev-${GITHUB_SHA::7}"; fi
          ART=build/Polaris_artefacts/Release
          mkdir -p dist/pkg
          cp -R "$ART/VST3/Polaris.vst3" dist/pkg/
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            NAME="Polaris-$VERSION-Windows"
            cp "$ART/Standalone/Polaris.exe" dist/pkg/
            cp packaging/INSTALL-Windows.txt dist/pkg/INSTALL.txt
            (cd dist/pkg && cmake -E tar cf "../$NAME.zip" --format=zip .)
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            NAME="Polaris-$VERSION-macOS"
            cp -R "$ART/AU/Polaris.component" dist/pkg/
            cp -R "$ART/Standalone/Polaris.app" dist/pkg/
            cp packaging/INSTALL-macOS.txt dist/pkg/INSTALL.txt
            (cd dist/pkg && cmake -E tar cf "../$NAME.zip" --format=zip .)
          else
            NAME="Polaris-$VERSION-Linux-x64"
            cp "$ART/Standalone/Polaris" dist/pkg/
            cp packaging/INSTALL-Linux.txt dist/pkg/INSTALL.txt
            (cd dist/pkg && tar czf "../$NAME.tar.gz" .)   # tar keeps the executable bit
          fi
          echo "ZIP_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then TAG="$GITHUB_REF_NAME"; else TAG="$RELEASE_VERSION"; fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Polaris $TAG" \
            --notes-file packaging/RELEASE_NOTES.md
